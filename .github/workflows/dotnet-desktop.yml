name: Build and Push with .NET SDK

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: "crappointments"
  DOTNET_VERSION: "10.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Code Download
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installation of .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Login in Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Creation of DOCKER CONFIG
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: crAppointments
          password: ${{ secrets.ACR_PASSWORD }}

      # 5. Build and direct upload
      - name: Publish Container
        working-directory: ./Dentists.Api
        run: |
          dotnet publish -c Release /t:PublishContainer \
            -p:ContainerRegistry=${{ env.ACR_NAME }}.azurecr.io \
            -p:ContainerImageTag=latest \
            -p:ContainerImageTag=${{ github.sha }}
